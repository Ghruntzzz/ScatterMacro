name: Build and publish Anime Expeditions

on:
  push:
    branches: [main]
    paths:
      - ui/unit_manager.py
      - ui/dashboard.py
      - ui/story_navigation.py
      - python_macro/**
      - tools/BuildAnimeExpeditions.ps1
      - tools/PackageMacro.py
      - tests/test_unit_manager.py
      - tests/test_story.py
      - tests/test_input.py
      - tests/test_dashboard_setup.py
      - tests/test_deployment.py
      - anime_main.py
      - .github/workflows/publish-anime-expeditions.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scattermacro-anime-expeditions-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r ui/requirements-python.txt
      - name: Test macro code
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
      - name: Build Windows macro and validate installer
        shell: pwsh
        run: ./tools/BuildAnimeExpeditions.ps1
      - name: Publish and verify macro archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.1.11'
          $tag = "anime-expeditions-v$version"
          $name = "AnimeExpeditions-$version-windows.zip"
          $archive = "dist/$name"
          if (!(Test-Path $archive)) { throw "Missing macro ZIP: $archive" }
          gh release create $tag $archive --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Anime Expeditions $version - Reliable Story Navigation" --notes "Story navigation now hovers, performs quick 2px cursor jitter before clicking and searches missing maps with bounded downward wheel scrolling after focusing the lower map list. Runtime retries Roblox viewport alignment on launch to avoid requiring a window drag. F2 cancel remains available. Runtime dashboard: Numbered placement markers, arrow-free position fields, dropdown upgrades, no jump section, unit slots 0-6, optional per-index Place at wave textbox with matching field styling and full-width alignment, wave-gating helper and a clean runtime Action Output without the extra Stop button. F2 stop remains active. Roblox viewport extends from 720 to 760 px high within the runtime, with the client aligned to the full height. Copy/paste and auto-save preserved. Preserves existing route configurations. Story navigation remains limited; unit placement and upgrades are not automated."
          if ($LASTEXITCODE -ne 0) { throw 'Macro release upload failed' }
          New-Item -ItemType Directory -Force 'dist/verified' | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $name --dir 'dist/verified'
          if ($LASTEXITCODE -ne 0) { throw 'Macro release download failed' }
          $sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $published = (Get-FileHash "dist/verified/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -ne $published) { throw 'Published macro checksum mismatch' }
      - name: Publish to launcher Updates tab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.1.11'
          $archive = "dist/AnimeExpeditions-$version-windows.zip"
          $sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/anime-expeditions-v$version/AnimeExpeditions-$version-windows.zip"
          # Fetch the newest main branch, including any independently published launcher feed.
          git fetch origin main
          git reset --hard origin/main
          $catalog = Get-Content catalog.json -Raw | ConvertFrom-Json
          $macro = @($catalog.macros | Where-Object { $_.id -eq 'anime-expeditions' })
          if ($macro.Count -ne 1) { throw 'Anime Expeditions catalog entry missing or duplicated' }
          $macro[0].version = $version
          $macro[0].url = $url
          $macro[0].sha256 = $sha256
          $macro[0].description = "Runtime Story navigation test and modern PySide6 Unit Manager: numbered placement markers, upgrade dropdowns, arrow-free X/Y, 104 editable indexes and auto-save, with Place at wave saved per index, unit slots 0-6 and a taller 760px Roblox viewport. Automatic wave detection and unit placement are not connected. Unit placement/upgrade execution and other modes are not connected."
          $catalog | ConvertTo-Json -Depth 20 | Set-Content catalog.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Publish verified Anime Expeditions $version in unified updates"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit macro update feed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish macro update feed' }
